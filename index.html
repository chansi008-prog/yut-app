<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>윷놀이 한판</title>
<meta name="description" content="태블릿을 돌려 가며, 또는 컴퓨터와 함께 하는 윷놀이">
<meta name="theme-color" content="#FBF3E4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="윷놀이 한판">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v1.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #FBF3E4;
    --card: #FFFDF8;
    --ink: #3B2A1E;
    --soft: #8A715C;
    --line: #EADBC2;
    --board: #F3DFBC;
    --board-edge: #D9B98A;
    --track: #9A6A3C;
    --accent: #D9472B;
    --accent-ink: #FFFFFF;
    --jade: #2E7D6B;
    --scrim: rgba(59, 42, 30, .45);
    --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { min-height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  input { font: inherit; color: inherit; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 12px 16px 24px; }
  .hidden { display: none !important; }

  /* ───── 설정 화면 ───── */
  .logo { text-align: center; margin: 18px 0 18px; }
  .logo h1 { margin: 6px 0 0; font-size: 40px; font-weight: 400; letter-spacing: -1px; }
  .logo .mini-sticks { display: inline-flex; gap: 6px; }
  .logo .mini-sticks i { display: block; width: 12px; height: 46px; border-radius: 6px; background: linear-gradient(90deg, #B97A40, #D8A262 55%, #B97A40); box-shadow: 0 2px 0 #8C5A2C; }
  .logo .mini-sticks i:nth-child(2n) { background: #F6E3BE; box-shadow: 0 2px 0 #CDA670; transform: translateY(4px) rotate(4deg); }
  .logo .mini-sticks i:nth-child(3) { transform: rotate(-5deg); }
  .card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 0 var(--line), 0 6px 18px rgba(120, 80, 30, .07); }
  .card h2 { margin: 0 0 12px; font-size: 19px; font-weight: 400; display: flex; align-items: center; justify-content: space-between; }
  .stepper { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 999px; padding: 4px; }
  .stepper button { width: 34px; height: 34px; border-radius: 50%; background: var(--card); font-size: 20px; box-shadow: 0 1px 0 var(--line); }
  .stepper button:disabled { opacity: .35; }
  .stepper b { min-width: 46px; text-align: center; font-weight: 400; font-size: 18px; }
  .team-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px dashed var(--line); }
  .team-row:first-of-type { border-top: 0; }
  .ani { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; user-select: none; }
  .ani-inline { width: 1.35em; height: 1.35em; vertical-align: -.32em; display: inline-block; }
  .emoji-btn { position: relative; width: 52px; height: 52px; flex: none; border-radius: 50%; display: grid; place-items: center; padding: 6px;
    background: radial-gradient(circle at 50% 35%, #fff, #FFF1DA); box-shadow: inset 0 0 0 3.5px var(--c), 0 3px 0 rgba(59,42,30,.12); }
  .emoji-btn::after { content: "바꾸기"; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); font-size: 10px; background: var(--ink); color: #fff; border-radius: 6px; padding: 0 4px; line-height: 15px; white-space: nowrap; }
  .animal-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .animal-grid button { border-radius: 18px; padding: 8px 4px 6px; background: var(--bg); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 15px; }
  .animal-grid button img { width: min(64px, 100%); height: auto; aspect-ratio: 1; }
  .animal-grid button.on { background: var(--card); box-shadow: inset 0 0 0 3px var(--c); }
  .animal-grid button:disabled { opacity: .3; }
  .team-row input { flex: 1; min-width: 110px; height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--bg); font-size: 18px; outline: none; }
  .team-row input:focus { border-color: var(--track); }
  .who { flex: none; display: flex; background: var(--bg); border-radius: 12px; padding: 3px; }
  .who button { padding: 8px 10px; border-radius: 9px; font-size: 15px; color: var(--soft); }
  .who button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
  .seg { display: flex; background: var(--bg); border-radius: 14px; padding: 4px; }
  .seg button { flex: 1; height: 42px; border-radius: 11px; font-size: 18px; color: var(--soft); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--line); }
  .toggle:first-of-type { border-top: 0; padding-top: 0; }
  .toggle small { display: block; color: var(--soft); font-size: 14px; margin-top: 2px; }
  .switch { flex: none; width: 54px; height: 32px; border-radius: 999px; background: #DCCBAF; position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on { background: var(--jade); }
  .switch.on::after { transform: translateX(22px); }
  .big-btn { display: block; width: 100%; height: 58px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); font-size: 24px; box-shadow: 0 4px 0 #A8311B; transition: transform .08s, box-shadow .08s; }
  .big-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #A8311B; }
  .big-btn:disabled { background: #D7C6AA; box-shadow: 0 4px 0 #BCA884; color: #FFFDF8; }
  .big-btn.jade { background: var(--jade); box-shadow: 0 4px 0 #1E5A4C; }
  .big-btn.jade:active:not(:disabled) { box-shadow: 0 1px 0 #1E5A4C; }
  .ghost-btn { display: block; width: 100%; height: 50px; margin-top: 10px; border-radius: 16px; background: var(--card); font-size: 19px; box-shadow: 0 2px 0 var(--line); }
  .link-btn { display: block; margin: 14px auto 0; color: var(--soft); font-size: 16px; text-decoration: underline; text-underline-offset: 3px; }

  /* ───── 게임 화면 ───── */
  .topbar { display: flex; align-items: center; gap: 10px; }
  .turn-chip { flex: 1; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px; background: var(--card); box-shadow: 0 2px 0 var(--line); min-width: 0; }
  .turn-chip .face { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; padding: 5px;
    background: radial-gradient(circle at 50% 30%, #FFFFFF, #FFF1DA 70%); box-shadow: inset 0 0 0 3px var(--c); }
  .turn-chip .txt { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .turn-chip .txt small { color: var(--soft); font-size: 15px; margin-left: 4px; }
  .icon-btn { width: 46px; height: 46px; flex: none; border-radius: 50%; background: var(--card); box-shadow: 0 2px 0 var(--line); font-size: 22px; }

  /* 태블릿(가로)·TV: 왼쪽 말판, 오른쪽 윷판 */
  #game.wrap { max-width: 1500px; }
  .game-grid { display: grid; gap: 18px; }
  .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  @media (min-width: 700px) and (orientation: portrait) {
    .side { display: grid; grid-template-columns: 1.15fr 1fr; align-items: start; }
    .side .topbar { grid-column: 1 / -1; }
    .game-grid .board-wrap { width: min(100%, calc(100dvh - 520px)); margin: 0 auto; }
  }
  @media (min-width: 760px) and (orientation: landscape) {
    #game.wrap { padding: 16px; }
    .game-grid { grid-template-columns: auto minmax(330px, 1fr); align-items: start; }
    .game-grid .board-wrap { width: min(calc(100dvh - 40px), 60vw); position: sticky; top: 16px; }
    .teams { grid-template-columns: repeat(2, 1fr) !important; }
  }
  .board-wrap { container-type: inline-size; }
  .board-wrap { position: relative; width: 100%; aspect-ratio: 1; border-radius: 26px; background:
      repeating-linear-gradient(45deg, rgba(160,110,50,.05) 0 6px, transparent 6px 12px),
      repeating-linear-gradient(-45deg, rgba(160,110,50,.05) 0 6px, transparent 6px 12px),
      var(--board);
    box-shadow: inset 0 0 0 4px var(--board-edge), 0 5px 0 var(--board-edge), 0 10px 24px rgba(120,80,30,.15); }
  .board-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .layer { position: absolute; inset: 0; }
  .token { position: absolute; width: 10.5%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; padding: 1.1cqw;
    background: radial-gradient(circle at 50% 30%, #FFFFFF, #FFF1DA 70%);
    box-shadow: inset 0 0 0 .75cqw var(--c), 0 .55cqw 0 var(--c-dark, rgba(0,0,0,.3)), 0 1.2cqw 1.8cqw rgba(59,42,30,.28);
    transform: translate(-50%, calc(-50% - var(--k, 0) * 6px)); transition: left .2s ease-out, top .2s ease-out, opacity .3s, transform .2s;
    z-index: calc(10 + var(--k, 0)); }
  .token.out { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
  .token .badge { position: absolute; top: -18%; right: -18%; min-width: 2.6cqw; height: 2.6cqw; min-height: 20px; min-width: 20px; padding: 0 4px; border-radius: 99px; background: var(--ink); color: #fff; font-size: max(12px, 1.6cqw); display: grid; place-items: center; }
  .token.can { cursor: pointer; animation: bob 1s ease-in-out infinite; }
  .token.can::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px dashed var(--c); animation: spin 6s linear infinite; }
  .token.sel::after { border-style: solid; border-color: var(--ink); inset: -7px; }
  @keyframes bob { 50% { transform: translate(-50%, calc(-50% - var(--k, 0) * 6px - 4px)); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 갈 곳: 칸을 감싸는 고리 + 위에 작은 말풍선 (안에 있는 말이 가려지지 않게) */
  .dest { position: absolute; width: 12.5%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: max(3px, .6cqw) dashed var(--ink); background: rgba(255,255,255,.25);
    z-index: 40; cursor: pointer; animation: pulse 1s ease-in-out infinite; }
  .dest span { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -2px); white-space: nowrap; padding: .3cqw 1.4cqw; border-radius: 99px; background: var(--ink); color: #fff; font-size: max(12px, 2.3cqw); }
  .dest.catch { border-color: var(--accent); border-style: solid; }
  .dest.catch span { background: var(--accent); }
  .dest.goal { width: auto; aspect-ratio: auto; padding: .6cqw 2cqw; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font-size: max(13px, 2.6cqw); white-space: nowrap; }
  @keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.12); } }
  .trail { position: absolute; width: 2.2%; aspect-ratio: 1; border-radius: 50%; background: var(--ink); opacity: .45; transform: translate(-50%, -50%); z-index: 39; pointer-events: none; }

  .pop { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 60; pointer-events: none; text-align: center; white-space: nowrap; opacity: 0; }
  .pop b { display: block; font-weight: 400; font-size: 16cqw; color: var(--accent); -webkit-text-stroke: 3px #fff; paint-order: stroke fill; text-shadow: 0 5px 0 rgba(59,42,30,.25); line-height: 1; }
  .pop span { display: inline-block; margin-top: 6px; padding: 4px 14px; border-radius: 999px; background: var(--ink); color: #fff; font-size: max(18px, 3.4cqw); }
  .pop .pop-img { display: block; width: 26cqw; height: 26cqw; margin: 0 auto; padding: 2.4cqw; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #fff, #FFF1DA 70%); box-shadow: inset 0 0 0 1.6cqw var(--c), 0 1.2cqw 0 var(--c-dark), 0 2cqw 4cqw rgba(0,0,0,.25); }
  .pop.show { animation: popIn 1.1s ease-out forwards; }
  @keyframes popIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 30% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%) scale(1); } }

  /* 윷판 = 윷 던지는 빨간 담요. 말판(크림색)과 한눈에 구분되게 */
  .mat { position: relative; border-radius: 26px; padding: 14px 16px 16px; color: #FFF3DA;
    background: radial-gradient(120% 90% at 50% 35%, #B8382E 0%, #962A22 60%, #7C211B 100%);
    box-shadow: 0 5px 0 #5E1813, 0 10px 24px rgba(94,24,19,.25); }
  .mat::before { content: ""; position: absolute; inset: 7px; border-radius: 20px; border: 2px dashed rgba(240,200,120,.55); pointer-events: none; }
  .mat-title { position: relative; display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: #F3C97A; letter-spacing: 1px; margin: 2px 4px 0; }
  .mat-title .left { opacity: .95; }
  .mat .msg { color: #FBE3BE; }
  .mat .msg b { color: #fff; }
  .gauge { position: relative; margin: 6px 4px 12px; }
  .gauge .labels { position: relative; height: 22px; font-size: 14px; }
  .gauge .labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; color: #FBE3BE; }
  .gauge .bar { position: relative; height: 26px; border-radius: 13px; background: rgba(255,240,215,.22); overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.25); }
  .gauge .zone { position: absolute; top: 0; bottom: 0; }
  .z-weak { background: #8FA6C9; }
  .z-yut { background: #F2B630; }
  .z-mo { background: #5FD39A; }
  .z-nak { background: repeating-linear-gradient(45deg, #2A1B12 0 6px, #4A3020 6px 12px); }
  .gauge .needle { position: absolute; top: -5px; bottom: -5px; width: 6px; margin-left: -3px; border-radius: 3px; background: #fff; box-shadow: 0 0 0 2px #3B2A1E, 0 2px 6px rgba(0,0,0,.4); left: 0; }
  .gauge .needle.idle { opacity: .0; }
  .gauge .hit { position: absolute; right: 0; top: 0; font-size: 14px; color: #fff; }
  .mat .results .chip { background: rgba(255,243,218,.92); color: var(--ink); box-shadow: 0 2px 0 #5E1813; }
  .mat .results .chip.on { background: #3B2A1E; color: #fff; box-shadow: 0 2px 0 #1C130C; }
  .mat .results .chip.back { color: var(--accent); }
  .mat .results .chip.on.back { color: #FFB4A3; }
  .mat .results .chip.empty { background: none; box-shadow: none; color: #E9B9A0; }
  .hold-btn { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; height: 68px; font-size: 25px; background: #FFF3DA; color: #7C211B; box-shadow: 0 5px 0 #C9A774; }
  .hold-btn:active:not(:disabled) { box-shadow: 0 2px 0 #C9A774; }
  .hold-btn.holding { background: #FFE08A; transform: translateY(3px); box-shadow: 0 2px 0 #C9A774; }
  .hold-btn:disabled { background: rgba(255,243,218,.35); box-shadow: 0 5px 0 rgba(0,0,0,.15); color: rgba(255,255,255,.75); }
  .sticks { height: 112px; display: flex; justify-content: center; align-items: center; gap: 16px; position: relative; }
  .stick { width: 30px; height: 100px; border-radius: 13px; position: relative; transition: background .1s; }
  .stick.round { background: linear-gradient(90deg, #A86B35, #D49A5B 45%, #E2B074 55%, #A86B35); box-shadow: 0 3px 0 #7A4A20; }
  .stick.round::before { content: ""; position: absolute; inset: 10px 7px; border-radius: 6px; background: repeating-linear-gradient(180deg, transparent 0 9px, rgba(90,50,15,.25) 9px 11px); }
  .stick.flat { background: #F7E6C4; box-shadow: inset 0 0 0 2px #E1C391, 0 3px 0 #C99D63; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; color: #9A6A3C; font-size: 15px; }
  .stick.flat .mark { line-height: 1; }
  .stick.flat .mark.back { color: var(--accent); font-size: 14px; }
  .stick.toss { animation: toss .75s cubic-bezier(.3,.6,.4,1) both; animation-delay: var(--d, 0s); }
  @keyframes toss { 0% { transform: translateY(0) rotate(0); } 45% { transform: translateY(-70px) rotate(var(--r, 200deg)); } 80% { transform: translateY(4px) rotate(calc(var(--r, 200deg) * 1.9)); } 100% { transform: translateY(0) rotate(var(--end, 0deg)); } }
  .stick.fall { animation: fall .9s ease-in forwards; }
  @keyframes fall { 40% { transform: translate(30px, -60px) rotate(120deg); } 100% { transform: translate(160px, 60px) rotate(300deg); opacity: 0; } }
  .stick.dim { opacity: .5; }

  .msg { text-align: center; color: var(--soft); font-size: 17px; min-height: 24px; margin: 4px 0 10px; }
  .msg b { color: var(--ink); font-weight: 400; }
  .results { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; min-height: 44px; margin-bottom: 12px; }
  .chip { min-width: 64px; height: 44px; padding: 0 14px; border-radius: 14px; background: var(--bg); font-size: 20px; box-shadow: 0 2px 0 var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .chip small { font-size: 14px; color: var(--soft); }
  .chip.on { background: var(--ink); color: #fff; box-shadow: 0 2px 0 #1C130C; }
  .chip.on small { color: #E9D9C2; }
  .chip.back { color: var(--accent); }
  .chip.on.back { color: #FFB4A3; }
  .chip.empty { background: none; box-shadow: none; color: var(--soft); font-size: 16px; }

  .teams { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 8px; }
  .tcard { background: var(--card); border-radius: 16px; padding: 10px 8px 8px; text-align: center; box-shadow: 0 2px 0 var(--line); border: 2px solid transparent; transition: border-color .2s, transform .2s; min-width: 0; }
  .tcard.now { border-color: var(--c); transform: translateY(-2px); }
  .tcard .nm { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcard .nm .ai { font-size: 11px; color: #fff; background: var(--soft); border-radius: 6px; padding: 1px 4px; margin-left: 2px; vertical-align: 2px; }
  .tcard .wait { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; margin: 6px 0 4px; min-height: 30px; }
  .mini { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; padding: 4px;
    background: radial-gradient(circle at 50% 30%, #FFFFFF, #FFF1DA 70%); box-shadow: inset 0 0 0 2.5px var(--c), 0 2px 0 var(--c-dark, rgba(0,0,0,.25)); }
  .mini.can { cursor: pointer; animation: bob2 1s ease-in-out infinite; outline: 2px dashed var(--c); outline-offset: 2px; }
  .mini.sel { outline: 3px solid var(--ink); }
  .mini.gone { opacity: .3; filter: grayscale(1); }
  @keyframes bob2 { 50% { transform: translateY(-3px); } }
  .tcard .goal { font-size: 13px; color: var(--soft); }
  .tcard .goal b { color: var(--ink); font-weight: 400; }

  /* ───── 시트 / 오버레이 ───── */
  .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 100; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .2s; }
  .scrim.center { align-items: center; padding: 16px; }
  @keyframes fadeIn { from { opacity: 0; } }
  .sheet { width: 100%; max-width: 520px; background: var(--card); border-radius: 24px 24px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 85dvh; overflow: auto; animation: up .25s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h3 { margin: 0 0 12px; font-weight: 400; font-size: 22px; }
  .sheet .row-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 6px; font-size: 19px; border-top: 1px dashed var(--line); text-align: left; }
  .sheet .row-btn:first-of-type { border-top: 0; }
  .rules { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.65; color: var(--ink); }
  .rules h4 { font-family: var(--font); font-weight: 400; font-size: 18px; margin: 16px 0 4px; }
  .rules p, .rules ul { margin: 0; }
  .rules ul { padding-left: 18px; }
  .rules table { border-collapse: collapse; width: 100%; margin-top: 4px; }
  .rules td { border-bottom: 1px dashed var(--line); padding: 5px 4px; }
  .rules td:first-child { font-family: var(--font); font-size: 17px; width: 64px; }
  .win { width: 100%; max-width: 400px; background: var(--card); border-radius: 26px; padding: 26px 18px 18px; text-align: center; animation: up .3s ease-out; }
  .win .crown { width: 120px; height: 120px; margin: -70px auto 0; padding: 12px; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #fff, #FFF1DA 70%); box-shadow: inset 0 0 0 6px var(--c), 0 6px 0 var(--c-dark), 0 10px 24px rgba(0,0,0,.2); animation: bob2 1.2s ease-in-out infinite; }
  .win { margin-top: 60px; }

  .win .rank { margin: 14px 0 18px; text-align: left; }
  .win .rank div { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-top: 1px dashed var(--line); font-size: 18px; }
  .win .rank div span:last-child { margin-left: auto; color: var(--soft); font-size: 15px; }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 120; overflow: hidden; }

  @keyframes drop { to { transform: translateY(110vh) rotate(720deg); } }

  @media (prefers-reduced-motion: reduce) {

</style>

<body>

<!-- 설정 화면 -->

    </div>

  </div>

      </div>

    </aside>
  </div>
</section>

<div id="overlay"></div>

<script>
/* ════════ 판 모양 ════════
   0 = 출발/참먹이(오른쪽 아래), 바깥길은 시계 반대 방향으로 1~19
   5 = 오른쪽 위 모서리, 10 = 왼쪽 위, 15 = 왼쪽 아래
   20~24 = 5에서 15로 가는 대각선(22 = 가운데 방), 25·26·22·27·28 = 10에서 0으로 가는 대각선 */
const WAIT = -1, GOAL = 99;
const LO = 9, HI = 91, STEP = (HI - LO) / 5;
const P = {};
for (let k = 0; k <= 5; k++) {
  P[k] = [HI, HI - k * STEP];
  P[5 + k] = [HI - k * STEP, LO];
  P[10 + k] = [LO, LO + k * STEP];
  P[(15 + k) % 20] = [LO + k * STEP, HI];
}
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
[20, 21, 22, 23, 24].forEach((id, i) => P[id] = lerp(P[5], P[15], (i + 1) / 6));
[25, 26, null, 27, 28].forEach((id, i) => { if (id) P[id] = lerp(P[10], P[0], (i + 1) / 6); });
// 판 전체를 시계 방향으로 90도 돌려 출발점을 왼쪽 아래에 둔다
for (const id in P) { const [x, y] = P[id]; P[id] = [100 - y, x]; }
const BIG = [0, 5, 10, 15, 22];

// 빽도인데 지나온 기록이 없을 때 돌아갈 칸
const BACK_DEFAULT = { 0: 19, 20: 5, 21: 20, 22: 21, 23: 22, 24: 23, 25: 10, 26: 25, 27: 22, 28: 27 };
for (let i = 1; i <= 19; i++) BACK_DEFAULT[i] = i - 1;

function nextOf(cur, prev, first) {
  if (cur === WAIT) return 1;
  if (first) {               // 모서리·방에 멈춰 있다가 출발하면 지름길
    if (cur === 5) return 20;
    if (cur === 10) return 25;
    if (cur === 22) return 27;
  }
  if (cur === 0) return GOAL; // 참먹이에서 한 칸이라도 더 가면 골인
  if (cur >= 1 && cur <= 18) return cur + 1;
  if (cur === 19) return 0;
  if (cur === 22) return prev === 21 ? 23 : 27;
  return { 20: 21, 21: 22, 23: 24, 24: 15, 25: 26, 26: 22, 27: 28, 28: 0 }[cur];
}

// pos·hist에서 v칸(빽도는 -1) 갔을 때 지나는 칸들과 새 기록
function simulate(pos, hist, v) {
  const h = [...hist];
  if (v === -1) {
    const d = h.length ? h.pop() : BACK_DEFAULT[pos];
    return { path: [d], dest: d, hist: h };
  }
  const path = [];
  let cur = pos, prev = h.length ? h[h.length - 1] : null;
  for (let i = 0; i < v; i++) {
    const nx = nextOf(cur, prev, i === 0);
    h.push(cur === WAIT ? 0 : cur);
    path.push(nx);
    if (nx === GOAL) break;
    prev = cur === WAIT ? 0 : cur; cur = nx;
  }
  return { path, dest: path[path.length - 1], hist: h };
}
function distToGoal(pos, hist) { return simulate(pos, hist, 40).path.length; }

const YUT_NAME = { "-1": "빽도", 1: "도", 2: "개", 3: "걸", 4: "윷", 5: "모" };
const TEAM_COLORS = ["#F0675F", "#5B8DEF", "#4DB37E", "#F2B630"];
// 말 그림: Microsoft Fluent Emoji 3D (MIT 라이선스), animals/ 폴더
// 헬멧(레이싱 드라이버용)은 Fluent에 없어 같은 느낌으로 직접 그림 (scratchpad fluent/helmet.py)
// 진돗개(흰색)는 여우 얼굴을, 뱅갈 고양이(이마 줄무늬)는 고양이 얼굴을 다시 칠한 것 (scratchpad breeds.py)
// 12지 순서대로, 그다음 다른 동물들
const ZODIAC = [
  ["mouse", "쥐"], ["cow", "소"], ["tiger", "호랑이"], ["rabbit", "토끼"], ["dragon", "용"], ["snake", "뱀"],
  ["horse", "말"], ["sheep", "양"], ["monkey", "원숭이"], ["rooster", "닭"], ["jindo", "진돗개"], ["pig", "돼지"],
];
const OTHERS = [
  ["bengal", "고양이"], ["fox", "여우"], ["bear", "곰"], ["panda", "판다"], ["chick", "병아리"],
  ["frog", "개구리"], ["koala", "코알라"], ["hamster", "햄스터"], ["penguin", "펭귄"], ["lion", "사자"],
  ["soccer", "축구공"], ["helmet", "헬멧"],
];
const ANIMALS = [...ZODIAC, ...OTHERS];
const ANIMAL_NAME = Object.fromEntries(ANIMALS);
const OLD_EMOJI = { "🐯": "tiger", "🐰": "rabbit", "🐶": "jindo", "🐱": "bengal", "🐻": "bear", "🐼": "panda", "🐷": "pig", "🐸": "frog", "🐥": "chick", "🐮": "cow" };
const ani = (k, cls = "ani") => `<img class="${cls}" src="animals/${k}.png" alt="${ANIMAL_NAME[k] || ""}" draggable="false">`;
const darken = hex => { const n = parseInt(hex.slice(1), 16), f = v => Math.round(v * .72); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; };
function fixAnimals(teams) { teams.forEach((t, i) => {
  if (t.animal === "dog" || t.emoji === "🐶") { t.animal = "jindo"; if (t.name === "강아지") t.name = "진돗개"; }
  if (t.animal === "cat") t.animal = "bengal";
  if (t.animal === "baekgu") t.animal = "jindo";
  if (t.name === "생쥐" && t.animal === "mouse") t.name = "쥐";
  if (t.name === "젖소" && t.animal === "cow") t.name = "소"; if (!ANIMAL_NAME[t.animal]) t.animal = OLD_EMOJI[t.emoji] || DEFAULT_ANIMALS[i]; delete t.emoji; }); }
const DEFAULT_NAMES = ["호랑이", "토끼", "진돗개", "고양이"];
const DEFAULT_ANIMALS = ["tiger", "rabbit", "jindo", "bengal"];

/* ════════ 저장 ════════ */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

let cfg = store.get("yut.cfg", null) || {
  teams: [0, 1, 2, 3].map(i => ({ name: DEFAULT_NAMES[i], animal: DEFAULT_ANIMALS[i], ai: false })),
  count: 2, pieces: 4, back: true, nak: true, mult: 1.5,
};
cfg.mult ||= 1.5;
fixAnimals(cfg.teams);
let sound = store.get("yut.sound", true);
let G = null;                       // 진행 중인 판
const ui = { sel: 0, group: null, busy: false, aiTimer: null };

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms * (window.__speed || 1)));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ════════ 효과음 ════════ */
let actx = null;
function ensureAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch {} }
function tone(freq, dur, type = "sine", vol = .15, when = 0) {
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const sfx = {
  clack() { [0, .05, .11, .16].forEach((w, i) => tone(380 + i * 60 + Math.random() * 80, .07, "square", .06, w)); },
  step() { tone(660, .07, "triangle", .12); },
  good() { tone(523, .12, "triangle", .15); tone(784, .18, "triangle", .15, .1); },
  catch() { tone(392, .1, "square", .08); tone(523, .1, "square", .08, .09); tone(784, .22, "square", .08, .18); },
  bad() { tone(300, .2, "sawtooth", .07); tone(220, .3, "sawtooth", .07, .15); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, "triangle", .15, i * .12)); },
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

/* ════════ 설정 화면 ════════ */
function renderSetup() {
  $("#teamCount").textContent = cfg.count + "팀";
  $("#teamMinus").disabled = cfg.count <= 2;
  $("#teamPlus").disabled = cfg.count >= 4;
  $("#teamRows").innerHTML = cfg.teams.slice(0, cfg.count).map((t, i) => `
    <div class="team-row">
      <button class="emoji-btn" data-i="${i}" style="--c:${TEAM_COLORS[i]}" aria-label="동물 바꾸기">${ani(t.animal)}</button>
      <input data-i="${i}" value="${esc(t.name)}" maxlength="8" aria-label="${i + 1}팀 이름">
      <div class="who" data-i="${i}">
        <button data-ai="0" class="${t.ai ? "" : "on"}">사람</button><button data-ai="1" class="${t.ai ? "on" : ""}">컴퓨터</button>
      </div>
    </div>`).join("");
  document.querySelectorAll("#pieceSeg button").forEach(b => b.classList.toggle("on", +b.dataset.n === cfg.pieces));
  document.querySelectorAll("#multSeg button").forEach(b => b.classList.toggle("on", +b.dataset.m === cfg.mult));
  $("#ruleBack").classList.toggle("on", cfg.back);
  $("#ruleNak").classList.toggle("on", cfg.nak);
  const saved = store.get("yut.game", null);
  $("#resumeBtn").classList.toggle("hidden", !(saved && !saved.over));
}
$("#teamMinus").onclick = () => { cfg.count = Math.max(2, cfg.count - 1); saveCfg(); renderSetup(); };
$("#teamPlus").onclick = () => { cfg.count = Math.min(4, cfg.count + 1); saveCfg(); renderSetup(); };
$("#teamRows").addEventListener("click", e => {
  const eb = e.target.closest(".emoji-btn");
  if (eb) {
    pickAnimal(+eb.dataset.i); return;
  }
  const wb = e.target.closest(".who button");
  if (wb) { cfg.teams[+wb.parentElement.dataset.i].ai = wb.dataset.ai === "1"; saveCfg(); renderSetup(); }
});
$("#teamRows").addEventListener("input", e => {
  if (e.target.matches("input")) { cfg.teams[+e.target.dataset.i].name = e.target.value; saveCfg(); }
});
$("#pieceSeg").onclick = e => { const b = e.target.closest("button"); if (b) { cfg.pieces = +b.dataset.n; saveCfg(); renderSetup(); } };
$("#multSeg").onclick = e => { const b = e.target.closest("button"); if (b) { cfg.mult = +b.dataset.m; saveCfg(); renderSetup(); } };
$("#ruleBack").onclick = () => { cfg.back = !cfg.back; saveCfg(); renderSetup(); };
$("#ruleNak").onclick = () => { cfg.nak = !cfg.nak; saveCfg(); renderSetup(); };
$("#startBtn").onclick = () => newGame();
$("#resumeBtn").onclick = () => { G = store.get("yut.game", null); if (G) { fixAnimals(G.teams); enterGame(); } };
$("#rulesLink").onclick = () => showRules();
function pickAnimal(i) {
  const t = cfg.teams[i], used = cfg.teams.slice(0, cfg.count).map(x => x.animal);
  const grid = list => `<div class="animal-grid" style="--c:${TEAM_COLORS[i]}">
    ${list.map(([k, n]) => `<button data-k="${k}" class="${k === t.animal ? "on" : ""}" ${k !== t.animal && used.includes(k) ? "disabled" : ""}>${ani(k)}${n}</button>`).join("")}</div>`;
  openSheet(`<div class="sheet"><h3>${i + 1}팀 말 고르기</h3>
    ${grid(ANIMALS)}
    <button class="ghost-btn" data-close>닫기</button></div>`);
  $("#overlay .sheet").onclick = e => {
    if (e.target.closest("[data-close]")) return closeSheet();
    const b = e.target.closest("[data-k]");
    if (!b || b.disabled) return;
    // 이름을 안 바꿨으면(동물 이름 그대로면) 새 동물 이름으로 따라 바꾼다
    const nm = (t.name || "").trim();
    if (!nm || nm === ANIMAL_NAME[t.animal] || DEFAULT_NAMES.includes(nm)) t.name = ANIMAL_NAME[b.dataset.k];
    t.animal = b.dataset.k; saveCfg(); closeSheet(); renderSetup();
  };
}
function saveCfg() { store.set("yut.cfg", cfg); }

/* ════════ 판 진행 ════════ */
function newGame() {
  const teams = cfg.teams.slice(0, cfg.count).map((t, i) => ({
    name: (t.name || "").trim() || DEFAULT_NAMES[i], animal: t.animal, ai: t.ai, color: TEAM_COLORS[i],
  }));
  G = { teams, rules: { back: cfg.back, nak: cfg.nak, mult: cfg.mult }, pieces: [], turn: 0, throwsLeft: 1, results: [], over: false, winner: null, sticks: null };
  teams.forEach((_, t) => { for (let i = 0; i < cfg.pieces; i++) G.pieces.push({ id: `${t}-${i}`, team: t, pos: WAIT, hist: [] }); });
  enterGame();
  showTurnPop();
}
function enterGame() {
  $("#setup").classList.add("hidden");
  $("#game").classList.remove("hidden");
  $("#tokenLayer").innerHTML = "";
  Object.assign(ui, { sel: 0, group: null, busy: false });
  drawBoard();
  renderSticks(G.sticks);
  $("#gauge").dataset.ready = ""; renderGauge(null);
  save(); render();
  if (G.over) showWin(); else scheduleAI();
}
function leaveGame() {
  clearTimeout(ui.aiTimer);
  G = null;
  $("#game").classList.add("hidden");
  $("#setup").classList.remove("hidden");
  renderSetup();
}
function save() { if (G) store.set("yut.game", G); }

const team = () => G.teams[G.turn];
const isAI = () => G && !G.over && team().ai;
const piecesOf = t => G.pieces.filter(p => p.team === t);
const onBoard = p => p.pos !== WAIT && p.pos !== GOAL;
const stackAt = (t, pos) => G.pieces.filter(p => p.team === t && p.pos === pos);

// 결과 v로 움직일 수 있는 말 묶음: 칸 번호, 또는 WAIT(새 말 올리기)
function groupsFor(t, v) {
  const out = [];
  for (const p of piecesOf(t)) {
    if (p.pos === GOAL) continue;
    if (p.pos === WAIT) { if (v > 0 && !out.includes(WAIT)) out.push(WAIT); }
    else if (!out.includes(p.pos)) out.push(p.pos);
  }
  return out;
}
function leadOf(t, g) { return g === WAIT ? piecesOf(t).find(p => p.pos === WAIT) : stackAt(t, g)[0]; }
function planMove(t, g, v) { const l = leadOf(t, g); return simulate(l.pos, l.hist, v); }

/* ════════ 던지기 게이지 ════════
   버튼을 누르고 있는 동안 바늘이 0→100→0 으로 왔다 갔다 한다.
   놓는 순간 바늘이 있는 구역의 결과가 G.rules.mult 배 잘 나온다. */
const SWEEP_MS = 1500;                 // 0에서 100까지 가는 시간
function zones() {
  const z = [
    { from: 0, to: 12, key: G.rules.back ? -1 : 1, label: G.rules.back ? "빽도" : "도", cls: "z-weak" },
    { from: 44, to: 58, key: 4, label: "윷", cls: "z-yut" },
    { from: 78, to: 86, key: 5, label: "모", cls: "z-mo" },
  ];
  if (G.rules.nak) z.push({ from: 90, to: 100, key: "nak", label: "낙", cls: "z-nak" });
  return z;
}
const zoneAt = g => g == null ? null : zones().find(z => g >= z.from && g < z.to + (z.to === 100 ? 1 : 0)) || null;
const gaugeAt = ms => { const t = (ms % (SWEEP_MS * 2)) / SWEEP_MS; return (t <= 1 ? t : 2 - t) * 100; };

// 기본 확률(윷 4개를 반반으로 던졌을 때): 도 4/16, 개 6/16, 걸 4/16, 윷 1/16, 모 1/16, 그중 빽도는 도의 1/4
function odds(zone) {
  const w = { 1: 4, 2: 6, 3: 4, 4: 1, 5: 1 };
  if (G.rules.back) { w[1] = 3; w[-1] = 1; }
  if (zone && zone.key in w) w[zone.key] *= G.rules.mult;
  const sum = Object.values(w).reduce((a, b) => a + b, 0);
  const nak = G.rules.nak ? .05 * (zone && zone.key === "nak" ? G.rules.mult : 1) : 0;
  const out = { nak };
  for (const k in w) out[k] = w[k] / sum * (1 - nak);
  return out;
}
function facesFor(v) {
  if (v === 5) return [false, false, false, false];
  if (v === -1) return [true, false, false, false];
  const idx = [0, 1, 2, 3].filter(i => !(v === 1 && G.rules.back && i === 0));   // 도는 빽도 표시 윷이 아닌 것
  const f = [false, false, false, false];
  idx.sort(() => Math.random() - .5).slice(0, v).forEach(i => f[i] = true);
  return f;
}
function roll(g) {
  const zone = zoneAt(g), o = odds(zone);
  let r = Math.random();
  if (r < o.nak) return { nak: true, faces: [0, 1, 2, 3].map(() => Math.random() < .5), zone };
  r -= o.nak;
  for (const v of [-1, 1, 2, 3, 4, 5]) {
    if (!(v in o)) continue;
    if (r < o[v]) return { v, faces: facesFor(v), zone };
    r -= o[v];
  }
  return { v: 2, faces: facesFor(2), zone };
}

function renderGauge(g) {
  const el = $("#gauge");
  if (!el.dataset.ready || el.dataset.ready !== JSON.stringify(G.rules)) {
    const zs = zones();
    el.innerHTML = `<div class="labels">${zs.map(z => `<span style="left:${(z.from + z.to) / 2}%">${z.label}</span>`).join("")}</div>
      <div class="bar">${zs.map(z => `<div class="zone ${z.cls}" style="left:${z.from}%;width:${z.to - z.from}%"></div>`).join("")}</div>
      <div class="needle idle"></div>`;
    // 양 끝 라벨은 안쪽으로 붙인다
    const ls = el.querySelectorAll(".labels span");
    if (ls.length) { ls[0].style.left = "0"; ls[0].style.transform = "none"; }
    if (G.rules.nak) { const l = ls[ls.length - 1]; l.style.left = "auto"; l.style.right = "0"; l.style.transform = "none"; }
    el.dataset.ready = JSON.stringify(G.rules);
  }
  const n = el.querySelector(".needle");

  if (g != null) n.style.left = g + "%";
}
let hold = null;                       // { t0, raf }
function startHold() {
  if (hold || ui.busy || !G || G.over || isAI() || G.throwsLeft <= 0) return;
  ensureAudio();
  hold = { t0: performance.now() };
  $("#actBtn").classList.add("holding");
  $("#actBtn").textContent = "놓으면 던져요!";
  const tick = () => { if (!hold) return; renderGauge(gaugeAt(performance.now() - hold.t0)); hold.raf = requestAnimationFrame(tick); };
  tick();
}
function endHold() {
  if (!hold) return;
  cancelAnimationFrame(hold.raf);
  const g = gaugeAt(performance.now() - hold.t0);
  hold = null;
  $("#actBtn").classList.remove("holding");
  renderGauge(g);
  throwYut(g);
}

async function throwYut(g) {
  if (ui.busy || !G || G.over || G.throwsLeft <= 0) return;
  ui.busy = true; render();
  const r = roll(g);
  if (r.zone) setMsg(`<b>${r.zone.label}</b> 구역! ${r.zone.label} 확률 ×${G.rules.mult}`);
  await animateSticks(r);
  G.throwsLeft--;
  if (r.nak) {
    sfx.bad(); pop("낙!", "윷이 떨어졌어요");
  } else {
    G.results.push(r.v);
    if (r.v >= 4) { G.throwsLeft++; sfx.good(); pop(YUT_NAME[r.v] + "!", "한 번 더!"); }
    else if (r.v === -1) { sfx.bad(); pop("빽도!", "한 칸 뒤로"); }
    else { sfx.step(); pop(YUT_NAME[r.v] + "!"); }
  }
  G.sticks = r;
  buzz(30);
  await sleep(r.nak ? 900 : 650);
  ui.busy = false;
  await afterChange();
}

async function afterChange() {
  if (!G || G.over) return render();
  if (G.throwsLeft <= 0) {
    const anyOn = piecesOf(G.turn).some(onBoard);
    if (!anyOn && G.results.length && G.results.every(v => v === -1)) {
      G.results = [];
      setMsg("올라간 말이 없어서 빽도는 넘어가요");
      render(true); await sleep(1300);
    }
    if (!G.results.length) { save(); await sleep(400); return nextTurn(); }
    ui.sel = Math.min(ui.sel, G.results.length - 1);
    if (!usable(ui.sel)) ui.sel = G.results.findIndex((_, i) => usable(i));
    ui.group = null;
  }
  save(); render(); scheduleAI();
}
function usable(i) { return groupsFor(G.turn, G.results[i]).length > 0; }

function nextTurn() {
  G.turn = (G.turn + 1) % G.teams.length;
  G.throwsLeft = 1; G.results = []; G.sticks = null;
  Object.assign(ui, { sel: 0, group: null });
  renderSticks(null); renderGauge(null);
  save(); render(); showTurnPop(); scheduleAI();
}
function showTurnPop() { pop("", `${team().name} 차례`, team()); }

async function doMove(ri, g) {
  if (ui.busy) return;
  const v = G.results[ri], t = G.turn;
  if (v === undefined || !groupsFor(t, v).includes(g)) return;
  ui.busy = true;
  const movers = g === WAIT ? [leadOf(t, WAIT)] : stackAt(t, g);
  const plan = simulate(movers[0].pos, movers[0].hist, v);
  G.results.splice(ri, 1);
  ui.group = null;
  for (const st of plan.path) {
    movers.forEach(p => p.pos = st);
    render(); sfx.step();
    await sleep(240);
  }
  movers.forEach(p => p.hist = [...plan.hist]);
  const dest = plan.dest;
  if (dest === GOAL) {
    movers.forEach(p => p.hist = []);
    sfx.good(); pop("골인!", movers.length > 1 ? `${movers.length}개가 한꺼번에` : "");
  } else {
    const foes = G.pieces.filter(p => p.team !== t && p.pos === dest);
    const mates = stackAt(t, dest);
    if (foes.length) {
      foes.forEach(p => { p.pos = WAIT; p.hist = []; });
      // 윷·모로 잡으면 이미 한 번 더 던졌으니 잡은 보너스는 없다
      const bonus = v !== 4 && v !== 5;
      if (bonus) G.throwsLeft++;
      sfx.catch(); buzz([40, 40, 80]);
      pop("잡았다!", bonus ? "한 번 더!" : `${YUT_NAME[v]}로 잡아서 추가 던지기는 없어요`);
    } else if (mates.length > movers.length) {
      mates.forEach(p => p.hist = [...plan.hist]);
      sfx.good(); pop("업었다!", `${mates.length}개 함께`);
    }
  }
  if (piecesOf(t).every(p => p.pos === GOAL)) { G.over = true; G.winner = t; }
  render();
  await sleep(450);
  ui.busy = false;
  save();
  if (G.over) { render(); sfx.win(); showWin(); return; }
  await afterChange();
}

/* ════════ 컴퓨터 ════════ */
function scheduleAI() {
  clearTimeout(ui.aiTimer);
  if (isAI()) ui.aiTimer = setTimeout(aiStep, 800);
}
async function aiStep() {
  if (!isAI() || ui.busy) return;
  if (G.throwsLeft > 0) {
    // 컴퓨터도 게이지를 누른다: 반쯤은 윷·모 구역을 노리고, 나머지는 아무 데나
    ui.busy = true; render();
    const aim = Math.random() < .5 ? [51, 82][Math.floor(Math.random() * 2)] + (Math.random() * 10 - 5) : Math.random() * 88;
    const sweeps = 1 + Math.floor(Math.random() * 2);
    const total = SWEEP_MS * 2 * sweeps + aim / 100 * SWEEP_MS;
    const t0 = performance.now();
    const k = window.__speed || 1;
    for (let e = 0; e < total; e = (performance.now() - t0) / k) { renderGauge(gaugeAt(e)); await new Promise(r => setTimeout(r, 16)); }
    renderGauge(gaugeAt(total));
    ui.busy = false;
    return throwYut(gaugeAt(total));
  }
  const m = aiChoose();
  if (!m) return;
  ui.sel = m.ri; ui.group = m.g; render();
  await sleep(700);
  await doMove(m.ri, m.g);
}
function threatened(pos, t) {
  if (pos === WAIT || pos === GOAL) return false;
  for (let o = 0; o < G.teams.length; o++) {
    if (o === t) continue;
    const leads = [];
    for (const p of piecesOf(o)) if (p.pos !== GOAL && !leads.some(l => l.pos === p.pos)) leads.push(p);
    for (const l of leads) {
      for (let k = 1; k <= 5; k++) if (simulate(l.pos, l.hist, k).dest === pos) return true;
      if (G.rules.back && l.pos !== WAIT && simulate(l.pos, l.hist, -1).dest === pos) return true;
    }
  }
  return false;
}
function evalMove(t, g, v) {
  const lead = leadOf(t, g), n = g === WAIT ? 1 : stackAt(t, g).length;
  const plan = simulate(lead.pos, lead.hist, v);
  if (plan.dest === GOAL) return 200 + 60 * n;
  let s = (distToGoal(lead.pos, lead.hist) - distToGoal(plan.dest, plan.hist)) * 3 * n;
  const foes = G.pieces.filter(p => p.team !== t && p.pos === plan.dest).length;
  const mates = stackAt(t, plan.dest).length;
  if (foes) s += (v === 4 || v === 5 ? 60 : 90) + 25 * foes;
  if (mates) s += 18;
  if ([5, 10, 22].includes(plan.dest)) s += 12;
  if (!foes && threatened(plan.dest, t)) s -= 40 * (n + mates);
  if (g !== WAIT && threatened(lead.pos, t)) s += 30 * n;
  if (g === WAIT) s += 4;
  return s;
}
function aiChoose() {
  let best = null;
  G.results.forEach((v, ri) => {
    for (const g of groupsFor(G.turn, v)) {
      const s = evalMove(G.turn, g, v) + Math.random() * 4;
      if (!best || s > best.s) best = { ri, g, s };
    }
  });
  return best;
}

/* ════════ 그리기 ════════ */
function drawBoard() {
  const L = (a, b) => `<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}"/>`;
  let s = `<g stroke="#9A6A3C" stroke-width=".9" stroke-linecap="round" opacity=".55">`;
  s += `<rect x="${LO}" y="${LO}" width="${HI - LO}" height="${HI - LO}" fill="none"/>` + L(5, 15) + L(10, 0) + `</g>`;
  for (const id of Object.keys(P).map(Number)) {
    const [x, y] = P[id];
    if (BIG.includes(id)) {
      s += `<circle cx="${x}" cy="${y}" r="5.4" fill="#FFF6E4" stroke="#9A6A3C" stroke-width="1"/>`;
      s += `<circle cx="${x}" cy="${y}" r="3.4" fill="none" stroke="#9A6A3C" stroke-width=".7"/>`;
    } else {
      s += `<circle cx="${x}" cy="${y}" r="3.3" fill="#FFF6E4" stroke="#9A6A3C" stroke-width=".8"/>`;
    }
  }
  s += `<text x="${P[0][0]}" y="${P[0][1] + 0.2}" font-size="3.4" text-anchor="middle" dominant-baseline="middle" fill="#9A6A3C" font-family="Jua, sans-serif">출발</text>`;
  // 모서리·방에서 갈 수 있는 방향: 초록 실선 = 멈췄다 출발하면 가는 지름길, 갈색 점선 = 지나갈 때 계속 가는 길
  const arrow = (from, to, kind) => {
    const [x0, y0] = P[from], [x1, y1] = P[to];
    const d = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / d, uy = (y1 - y0) / d;
    const a = [x0 + ux * 6.6, y0 + uy * 6.6], b = [x0 + ux * 12.2, y0 + uy * 12.2];
    const h = 1.9, px = -uy, py = ux;
    const head = `M ${b[0] - ux * h + px * h} ${b[1] - uy * h + py * h} L ${b[0]} ${b[1]} L ${b[0] - ux * h - px * h} ${b[1] - uy * h - py * h}`;
    const st = { short: 'stroke="#2E7D6B" stroke-width="1.5"', pass: 'stroke="#9A6A3C" stroke-width="1.1"', only: 'stroke="#9A6A3C" stroke-width="1.3"' }[kind];
    const dash = kind === "pass" ? ' stroke-dasharray="1.4 1.3"' : "";
    return `<g fill="none" stroke-linecap="round" stroke-linejoin="round" ${st}><path d="M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}"${dash}/><path d="${head}"/></g>`;
  };
  s += arrow(0, 1, "only") + arrow(15, 16, "only");
  s += arrow(5, 20, "short") + arrow(5, 6, "pass");
  s += arrow(10, 25, "short") + arrow(10, 11, "pass");
  s += arrow(22, 27, "short") + arrow(22, 23, "pass");
  // 범례 (위쪽 여백)
  s += `<g font-family="Jua, sans-serif" font-size="2.6" fill="#7A5A3A" dominant-baseline="middle">
    <path d="M 27 3.4 L 32 3.4" stroke="#2E7D6B" stroke-width="1.3" stroke-linecap="round"/><text x="33.2" y="3.5">멈췄다 가면 지름길</text>
    <path d="M 56 3.4 L 61 3.4" stroke="#9A6A3C" stroke-width="1" stroke-dasharray="1.2 1.1" stroke-linecap="round"/><text x="62.2" y="3.5">지나가면 그대로</text></g>`;
  $("#boardSvg").innerHTML = s;
}

function currentChoices() {
  // 지금 사람이 고를 수 있는 말 묶음
  if (!G || G.over || ui.busy || isAI() || G.throwsLeft > 0 || !G.results.length) return [];
  return groupsFor(G.turn, G.results[ui.sel]);
}

function render(keepMsg) {

    <span class="txt">${esc(T.name)}<small>${T.ai ? "컴퓨터 차례" : "차례"}</small></span>`;

  const choices = currentChoices();
  if (ui.group === null && choices.length === 1) ui.group = choices[0];   // 고를 게 하나뿐이면 바로 선택
  if (ui.group !== null && !choices.includes(ui.group) && !(isAI() && ui.group !== null)) ui.group = null;

  // 판 위의 말

  const alive = new Set();

      if (plan.dest === GOAL) {

      } else {

        const foe = G.pieces.some(p => p.team !== G.turn && p.pos === plan.dest);
        const mate = !foe && G.pieces.some(p => p.team === G.turn && p.pos === plan.dest && p.pos !== ui.group);
        marks.insertAdjacentHTML("beforeend", `<button class="dest ${foe ? "catch" : ""}" style="left:${x}%;top:${y}%" aria-label="여기로 이동"><span>${foe ? "잡기!" : mate ? "업기" : "여기"}</span></button>`);
      }

  }

  // 결과 칩

  } else res.innerHTML = `<span class="chip empty">던진 결과가 여기 모여요</span>`;

  // 메시지 + 버튼

    else if (isAI()) setMsg(`<b>${esc(T.name)}</b>${G.throwsLeft > 0 ? "이(가) 윷을 던져요" : "이(가) 말을 고르고 있어요"}…`);
    else if (G.throwsLeft > 0) setMsg(G.results.length ? `한 번 더 던질 수 있어요${G.throwsLeft > 1 ? ` (${G.throwsLeft}번)` : ""}` : "버튼을 누르고 있다가, 바늘이 원하는 칸에 오면 떼세요");
    else if (ui.group === null) setMsg(G.results.length > 1 ? "쓸 결과를 고르고, 판에서 움직일 말을 누르세요" : "판에서 움직일 말을 누르세요");
    else setMsg(choices.length > 1 ? "표시된 곳으로 갈까요? 다른 말을 눌러 바꿀 수도 있어요" : "표시된 곳으로 갈까요?");
  }

  else if (ui.group !== null && !isAI()) { btn.textContent = "이동하기"; btn.disabled = ui.busy; btn.classList.add("jade"); }

}

/* ════════ 윷가락 ════════ */

async function animateSticks(r) {

  [...box.children].forEach((el, i) => {

    el.style.setProperty("--end", (Math.random() * 16 - 8).toFixed(1) + "deg");
    el.style.setProperty("--d", (i * .04) + "s");
    el.classList.add("toss");
  });
  sfx.clack();
  await sleep(420);
  // 공중에서 면을 정해 둔다
  [...box.children].forEach((el, i) => {
    const tmp = document.createElement("div"); tmp.innerHTML = stickHTML(i, r.faces[i]);
    el.className = tmp.firstChild.className + " toss"; el.innerHTML = tmp.firstChild.innerHTML;
  });
  if (r.nak) box.children[3].classList.replace("toss", "fall");
  await sleep(420);
  sfx.clack();
}

/* ════════ 입력 ════════ */
const act = $("#actBtn");
act.addEventListener("pointerdown", e => {
  if (!G || G.throwsLeft <= 0) return;
  e.preventDefault();
  try { act.setPointerCapture(e.pointerId); } catch {}
  startHold();
});
act.addEventListener("pointerup", endHold);
act.addEventListener("pointercancel", endHold);
act.addEventListener("contextmenu", e => e.preventDefault());
act.addEventListener("click", () => {
  if (!G || isAI() || G.throwsLeft > 0) return;
  if (ui.group !== null) doMove(ui.sel, ui.group);
  else if (currentChoices().includes(WAIT)) pickGroup(WAIT);
});
// 블루투스 키보드·리모컨: 스페이스를 누르고 있다가 떼기
document.addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat && G && !$("#game").classList.contains("hidden") && !$("#overlay").innerHTML) { e.preventDefault(); if (G.throwsLeft > 0) startHold(); else if (ui.group !== null) doMove(ui.sel, ui.group); } });
document.addEventListener("keyup", e => { if (e.code === "Space") endHold(); });
// 전체 화면 (TV 미러링할 때 주소창 숨기기)
$("#fsBtn").onclick = () => {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
};
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) || matchMedia("(display-mode: standalone)").matches) $("#fsBtn").classList.add("hidden");
$("#results").onclick = e => {
  const c = e.target.closest(".chip[data-i]");
  if (!c || !G || isAI() || ui.busy || G.throwsLeft > 0) return;
  ui.sel = +c.dataset.i;
  if (ui.group !== null && !groupsFor(G.turn, G.results[ui.sel]).includes(ui.group)) ui.group = null;
  render();
};
function pickGroup(g) {
  if (!currentChoices().includes(g)) return;
  if (ui.group === g) return doMove(ui.sel, g);   // 같은 말을 다시 누르면 이동
  ui.group = g; sfx.step(); render();
}
$("#tokenLayer").addEventListener("click", e => {
  const el = e.target.closest(".token");
  if (!el || !G) return;
  const pos = +el.dataset.pos;
  if (stackAt(G.turn, pos).length) pickGroup(pos);
});
$("#markLayer").addEventListener("click", e => {
  if (e.target.closest(".dest") && G && !isAI() && ui.group !== null) doMove(ui.sel, ui.group);
});
$("#teams").addEventListener("click", e => { if (e.target.closest("[data-new]")) pickGroup(WAIT); });

/* ════════ 메뉴 · 규칙 · 승리 ════════ */
function openSheet(html, center) {
  const o = $("#overlay");
  o.innerHTML = `<div class="scrim ${center ? "center" : ""}">${html}</div>`;
  o.firstChild.addEventListener("click", e => { if (e.target === o.firstChild && !center) closeSheet(); });
}
function closeSheet() { $("#overlay").innerHTML = ""; }

$("#menuBtn").onclick = () => {
  openSheet(`<div class="sheet"><h3>메뉴</h3>
    <button class="row-btn" data-act="restart">🔄 같은 설정으로 새 판</button>
    <button class="row-btn" data-act="setup">⚙️ 팀·규칙 바꾸기</button>
    <button class="row-btn" data-act="sound">${sound ? "🔊 효과음 끄기" : "🔈 효과음 켜기"}</button>
    <button class="row-btn" data-act="rules">📜 규칙 보기</button>
    <button class="ghost-btn" data-act="close">닫기</button></div>`);
  $("#overlay .sheet").onclick = e => {
    const a = e.target.closest("[data-act]")?.dataset.act;
    if (!a) return;
    if (a === "close") closeSheet();
    if (a === "sound") { sound = !sound; store.set("yut.sound", sound); closeSheet(); }
    if (a === "rules") showRules();
    if (a === "restart") { if (G.over || confirm("지금 판을 그만두고 새로 시작할까요?")) { closeSheet(); restartSame(); } }
    if (a === "setup") { closeSheet(); leaveGame(); }
  };
};
function restartSame() {
  clearTimeout(ui.aiTimer);
  const old = G;
  G = { ...old, pieces: old.pieces.map(p => ({ ...p, pos: WAIT, hist: [] })), turn: 0, throwsLeft: 1, results: [], over: false, winner: null, sticks: null };
  enterGame(); showTurnPop();
}

function showRules() {
  openSheet(`<div class="sheet rules"><h3 style="font-family:var(--font)">윷놀이 규칙</h3>
    <table>
      <tr><td>도</td><td>배(평평한 면) 1개 · 1칸</td></tr>
      <tr><td>개</td><td>배 2개 · 2칸</td></tr>
      <tr><td>걸</td><td>배 3개 · 3칸</td></tr>
      <tr><td>윷</td><td>배 4개 · 4칸, 한 번 더</td></tr>
      <tr><td>모</td><td>등(둥근 면) 4개 · 5칸, 한 번 더</td></tr>
      <tr><td style="color:var(--accent)">빽도</td><td>‘빽’ 표시 윷 하나만 배 · 1칸 뒤로</td></tr>
    </table>
    <h4>순서</h4>
    <p>윷이나 모가 나오면 계속 던지고, 다 던진 뒤 나온 결과를 원하는 순서로 말에 나눠 써요.</p>
    <h4>잡기 · 업기</h4>
    <ul><li>상대 말이 있는 칸에 멈추면 잡아서 처음으로 돌려보내고, 한 번 더 던져요.</li>
    <li>단, 윷이나 모로 잡았을 때는 이미 한 번 더 던졌으니 잡은 보너스는 없어요.</li>
    <li>내 말끼리 같은 칸에 멈추면 업어서 함께 움직여요. 잡히면 같이 잡혀요.</li></ul>
    <h4>지름길</h4>
    <p>모서리나 가운데 방에 <b>멈추면</b> 다음 차례에 대각선 지름길로 가요. 가운데 방에서는 출발점 쪽으로 가장 빨리 나가요.</p>
    <h4>골인</h4>
    <p>출발점(참먹이)을 지나가면 골인이에요. 출발점에 딱 멈추면 다음에 한 칸이라도 더 가야 골인해요. 말을 모두 먼저 골인시킨 팀이 이겨요.</p>
    <h4>빽도 · 낙</h4>
    <ul><li>빽도는 판 위에 말이 없으면 무효예요.</li><li>낙은 윷이 판 밖으로 떨어진 것으로, 그 던지기는 무효예요.</li></ul>
    <p style="margin-top:16px;color:var(--soft);font-size:12px">말 그림: Microsoft Fluent Emoji (MIT License)</p>
    <button class="ghost-btn" style="font-family:var(--font)" onclick="closeSheet()">닫기</button></div>`);
}

function showWin() {
  const W = G.teams[G.winner];
  const rank = G.teams.map((tm, t) => ({ tm, t, done: piecesOf(t).filter(p => p.pos === GOAL).length, dist: piecesOf(t).reduce((a, p) => a + (p.pos === GOAL ? 0 : distToGoal(p.pos, p.hist)), 0) }))
    .filter(r => r.t !== G.winner).sort((a, b) => b.done - a.done || a.dist - b.dist);
  openSheet(`<div class="win" style="--c:${W.color};--c-dark:${darken(W.color)}"><div class="crown">${ani(W.animal)}</div>
    <h3>${esc(W.name)} 승리!</h3><div style="color:var(--soft)">말 ${piecesOf(G.winner).length}개 모두 골인</div>
    <div class="rank">${rank.map((r, i) => `<div><span>${i + 2}등</span><span>${ani(r.tm.animal, "ani-inline")} ${esc(r.tm.name)}</span><span>골인 ${r.done}/${piecesOf(r.t).length}</span></div>`).join("")}</div>
    <button class="big-btn" id="againBtn">한 판 더</button>
    <button class="ghost-btn" id="toSetupBtn">팀·규칙 바꾸기</button></div>`, true);
  $("#againBtn").onclick = () => { closeSheet(); restartSame(); };
  $("#toSetupBtn").onclick = () => { closeSheet(); store.del("yut.game"); leaveGame(); };
  confetti(W.color);
}
function confetti(color) {
  const box = document.createElement("div"); box.className = "confetti";
  const cols = [color, "#F2B630", "#5B8DEF", "#4DB37E", "#F0675F", "#FFFFFF"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("i");
    c.style.left = Math.random() * 100 + "%";
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = 1.8 + Math.random() * 1.8 + "s";
    c.style.animationDelay = Math.random() * .6 + "s";
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4500);
}

/* ════════ 시작 ════════ */
renderSetup();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
